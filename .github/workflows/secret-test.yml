name: Secret test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Use the secret
        shell: pwsh
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          Write-Host "Length: $($env:DB_PASSWORD.Length)"
          Write-Host "Value: $env:DB_PASSWORD"
